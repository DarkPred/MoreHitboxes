modLoader = "javafml"
loaderVersion = "[${neoforge_loader_version_range},)"
license = "${mod_license}"
issueTrackerURL="https://github.com/DarkPred/MoreHitboxes/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${minecraft_version}-${mod_version}"
    displayName = "${mod_name}"
    #updateJSONURL="https://change.me.example.invalid/updates.json" #optional
    displayURL = "https://www.curseforge.com/minecraft/mc-mods/more-hitboxes"
    logoFile = "icon.png"
    authors = "${mod_author}" #optional
    description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    mandatory = true
    versionRange = "[${neoforge_version_range},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[${minecraft_version_range_lower},${minecraft_version_range_upper})"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "geckolib"
    mandatory = false
    versionRange = "[4.5.1,)"
    ordering = "AFTER"
    side = "BOTH"

