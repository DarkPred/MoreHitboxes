plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}
base {
    //Jar name
    archivesName = "$archives_name-${project.name}-$minecraft_version"
}

version = mod_version
group = maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()

    maven {
        name 'Sponge / Mixin'
        url 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name "Modrinth"
        url "https://api.modrinth.com/maven"
        content {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        url "https://cursemaven.com/"
        content {
            includeGroup("curse.maven")
        }
    }
    maven {
        name 'Gegy'
        url 'https://maven.gegy.dev'
    }
    maven {
        name 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }

    maven { url 'https://aperlambda.github.io/maven' }
    maven {
        name 'BlameJared Maven (CrT / Bookshelf)'
        url 'https://maven.blamejared.com'
    }
    maven { url "https://maven.shedaniel.me/" }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }
}

// Disables Gradle's custom module metadata from being published to maven. The
// metadata includes mapped dependencies which are not reasonably consumable by
// other mod developers.
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}


processResources {
    def expandProps = [
            "mod_version"                  : mod_version,
            "group"                        : project.group, //Else we target the task's group.
            "minecraft_version"            : minecraft_version,
            "minecraft_version_range_lower": minecraft_version_range_lower,
            "minecraft_version_range_upper": minecraft_version_range_upper,
            "fabric_version"               : fabric_api_version,
            "fabric_loader_version"        : fabric_loader_version,
            "fabric_loader_version_range"  : fabric_loader_version_range,
            "mod_name"                     : mod_name,
            "mod_author"                   : mod_author,
            "mod_id"                       : mod_id,
            "mod_license"                  : mod_license,
            "mod_description"              : mod_description,
            "forge_version_range"          : forge_version_range,
            "forge_loader_version_range"   : forge_loader_version_range,
            "java_version"                 : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
