subprojects {
    apply plugin: 'java'

    version = mod_version
    group = maven_group

    java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    java.withSourcesJar()
    //java.withJavadocJar()

    base {
        //Jar name
        archivesName = "$archives_name-${project.name}-$minecraft_version"
    }
    processResources {
        def expandProps = [
                "mod_version"                  : mod_version,
                "group"                        : project.group, //Else we target the task's group.
                "minecraft_version"            : minecraft_version,
                "minecraft_version_range_lower": minecraft_version_range_lower,
                "minecraft_version_range_upper": minecraft_version_range_upper,
                "fabric_version"               : fabric_api_version,
                "fabric_loader_version"        : fabric_loader_version,
                "fabric_loader_version_range"  : fabric_loader_version_range,
                "mod_name"                     : mod_name,
                "mod_author"                   : mod_author,
                "mod_id"                       : mod_id,
                "mod_license"                  : mod_license,
                "mod_description"              : mod_description,
                "forge_version_range"          : forge_version_range,
                "forge_loader_version_range"   : forge_loader_version_range,
                "java_version"                 : java_version
        ]
        from project(":common").sourceSets.main.resources

        inputs.properties(expandProps)
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml']) {
            expand expandProps
        }
    }

    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_$mod_name" }
        }
        manifest {
            attributes([
                    'Specification-Title'     : mod_name,
                    'Specification-Vendor'    : mod_author,
                    'Specification-Version'   : project.jar.archiveVersion,
                    'Implementation-Title'    : project.name,
                    'Implementation-Version'  : project.jar.archiveVersion,
                    'Implementation-Vendor'   : mod_author,
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    'Timestamp'               : System.currentTimeMillis(),
                    'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                    'Build-On-Minecraft'      : minecraft_version
            ])
        }
    }

    sourcesJar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_$mod_name" }
        }
    }

    repositories {
        mavenCentral()

        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'BlameJared Maven (CrT / Bookshelf)'
            url = 'https://maven.blamejared.com'
        }
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        }
        maven { url = 'https://maven.parchmentmc.org' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = java_version.toInteger()
    }
    tasks.withType(Javadoc).configureEach {
        options.tags("apiNote:a:API Note:")
        options.tags("implSpec:a:Implementation Requirements:")
        options.tags("implNote:a:Implementation Note:")
    }

    // Disables Gradle's custom module metadata from being published to maven. The
    // metadata includes mapped dependencies which are not reasonably consumable by
    // other mod developers.
    tasks.withType(GenerateModuleMetadata) {

        enabled = false
    }
}