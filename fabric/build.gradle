import net.darkhax.curseforgegradle.TaskPublishCurseForge
import net.fabricmc.loom.api.mappings.layered.MappingContext
import net.fabricmc.loom.api.mappings.layered.MappingLayer
import net.fabricmc.loom.api.mappings.layered.MappingsNamespace
import net.fabricmc.loom.api.mappings.layered.spec.MappingsSpec
import net.fabricmc.loom.configuration.providers.mappings.intermediary.IntermediaryMappingLayer
import net.fabricmc.mappingio.MappingVisitor
import net.fabricmc.mappingio.tree.MappingTreeView
import net.fabricmc.mappingio.tree.MemoryMappingTree

plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
    id 'idea'
    id "com.modrinth.minotaur" version "2.+"
    id "net.darkhax.curseforgegradle" version "1.1.25"
}


dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"
    mappings(loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-$parchment_mc_version:$parchment_date@zip")
        addLayer(new FixGeckoLibSpec())
    })
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    Set<String> apiModules = [
            "fabric-api-base",
            "fabric-lifecycle-events-v1",
            "fabric-resource-loader-v0",
            "fabric-networking-api-v1"
    ]
    apiModules.forEach {
        modImplementation(fabricApi.module(it, "$fabric_api_version+$minecraft_version"))
    }
    modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:$fabric_api_version+$minecraft_version"

    compileOnly project(":common")
    compileOnly annotationProcessor('com.google.auto.service:auto-service:1.1.1')
    modCompileOnly "software.bernie.geckolib:geckolib-fabric-1.19:$gecko_lib_version"
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
}

tasks.withType(JavaCompile) {
    source(project(":common").sourceSets.main.allSource)
}
javadoc {
    source project(":common").sourceSets.main.allJava
    source project.sourceSets.main.allJava
    exclude("**/mixin/**")
    options.addBooleanOption('-ignore-source-errors', true)
}

modrinth {
    token = "${project.property("MODRINTH_TOKEN")}" ?: "no value"
    projectId = "BOVAW87Z"
    versionNumber.set("$minecraft_version-$mod_version-${project.name}")
    versionType.set("release")
    uploadFile.set(tasks.remapJar)
    versionName = "$mod_version for Fabric $minecraft_version"
    gameVersions = game_versions.split(",").toList()
    debugMode = true
    dependencies {
        optional.project("geckolib")
    }
    changelog.set(rootProject.file("CHANGELOG.md").text)
}
tasks.register('publishCurseForge', TaskPublishCurseForge) {
    group = "publishing"
    description = "Publishes jar to CurseForge"
    apiToken = project.property("CURSEFORGE_TOKEN") ?: "no value"
    debugMode = true
    var mainFile = upload(1115989, tasks.remapJar)
    mainFile.addGameVersion(game_versions.split(","))
    mainFile.displayName = "$mod_version for Fabric $minecraft_version"
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.changelogType = "markdown"
    mainFile.releaseType = "release"
    mainFile.addOptional("geckolib")
}

tasks.named("publish") {
    finalizedBy("modrinth", "publishCurseForge")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId "$archives_name-${project.name}-$minecraft_version"
            version version
            from components.java
        }
    }

    repositories {
        if (project.hasProperty("cloudsmith_username") && project.hasProperty("cloudsmith_token")) {
            maven {
                name = "Cloudsmith"
                url = "https://maven.cloudsmith.io/darkpred-mods/more-hitboxes/"
                credentials {
                    username = project.property("cloudsmith_username")
                    password = project.property("cloudsmith_token")
                }
            }
        } else {
            mavenLocal()
        }
    }
}

class FixGeckoLibSpec implements MappingsSpec<FixGeckoLibLayer> {

    @Override
    FixGeckoLibLayer createLayer(MappingContext context) {
        return new FixGeckoLibLayer()
    }

    @Override
    int hashCode() {
        return "FixGeckoLibLayer".hashCode()
    }
}

class FixGeckoLibLayer implements MappingLayer {
    private final Map METHOD_NAME_MAP = Map.of("getTextureLocation", "_getTextureLocation");

    @Override
    void visit(MappingVisitor mappingVisitor) throws IOException {
        MemoryMappingTree memoryMappingTree = (MemoryMappingTree) mappingVisitor
        var getClasses = MappingTreeView.getDeclaredMethod("getClasses")
        var getMethods = MappingTreeView.ClassMappingView.getDeclaredMethod("getMethods")
        var getName = MappingTreeView.ElementMappingView.getDeclaredMethod("getName", String.class)
        var entryClass = Class.forName("net.fabricmc.mappingio.tree.MemoryMappingTree\$Entry")
        var srcNameField = entryClass.getDeclaredField("srcName")
        srcNameField.setAccessible(true)
        for (final def classEntry in getClasses.invoke(memoryMappingTree)) {
            for (final def methodEntry in getMethods.invoke(classEntry)) {
                var it = METHOD_NAME_MAP.get(getName.invoke(methodEntry, MappingsNamespace.NAMED.toString()))
                if (it != null) srcNameField.set(methodEntry, it)
            }
        }
    }

    @Override
    MappingsNamespace getSourceNamespace() {
        return MappingsNamespace.NAMED;
    }

    @Override
    List<Class<? extends MappingLayer>> dependsOn() {
        return List.of(IntermediaryMappingLayer.class)
    }
}
